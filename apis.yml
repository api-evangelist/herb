aid: herb
name: Herb
description: >-
  Herb (herb.co) is a leading digital media and e-commerce platform dedicated to
  cannabis culture, education, and lifestyle. It publishes cannabis news,
  strain databases, product reviews, dispensary and brand guides, deals,
  recipes, and city-level legalization guides, and operates the "Herb Agency"
  offering branding and marketing services to cannabis companies. The consumer
  site is built on Gatsby (React) with a GraphQL data layer, Algolia search, and
  a Firebase/serverless backend hosted on Netlify. Herb is backed by Bullpen
  Capital and was added to the API Evangelist network from that portfolio; the
  company exposes no public developer API program at this time, so this profile
  captures its published web, content, and discovery surface (llms.txt, domain
  security posture, and identity/link properties) rather than API artifacts.
